<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <button>Light mode / Dark mode</button>
        <h1>Generate a random password</h1>
        <h3>Never use an insecure password again.</h3>
        <h2>What do you want your passwords to include?</h2>
        <div>
            <label>
                <input type="checkbox" id="hasUppercase">
                uppercase
            </label>
            <label>
                <input type="checkbox" id="hasNumber">
                number
            </label>
            <label>
                <input type="checkbox" id="hasSymbol">
                symbols
            </label>
        </div>
        <div>
            <label for="password-length">Password Length:</label>
            <input
                type="number"
                id="password-length"
                placeholder="15"
            >
        </div>

        <button onclick="generatePasswords()">Generate passwords</button>

        <hr>
        <div id="passwords-output">
            <div>
                <p id="firstPassword">p1</p>
            </div>
            <div>
                <p id="secondPassword">p2</p>
            </div>
        </div>


        <script src="index.js"></script>
    </body>
</html>
