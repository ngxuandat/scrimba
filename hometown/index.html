<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Zen+Antique&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="hero">
            <h1>横浜へようこそ！</h1>
        </div>
        <div id="mid-section">
            <h1>
                東西と新古の文化が混ざり合った横浜を楽しもうぜ！
            </h1>
            <h1>
                横浜なら次がお勧め！
            </h1>
            <div id="cards">
                <section>
                    <div style="display: flex;">
                        <img src="assets/rinkoPark.jpg">
                        <img src="assets/yamashita.webp" onclick="openMap('yamashitaPark')" alt="yamashita park">
                    </div>
                    <h3>
                        <a href="#map" onclick="openMap('rinkoPark')">臨港パーク</a>から山下公園まで散歩</h3>
                    <p>海沿いの公園と横浜の東洋と西洋の混ざった景色を楽しみにしながら散歩する。</p>
                </section>
                <section>
                    <img src="assets/chinesetown.webp" onclick="openMap('chinaTown')" alt="chinesetown">
                    <h3>中華街でランチ</h3>
                    <p>日本の最も大きい中華街。真ん中じゃなくて周辺にあるお店がお勧め！</p>
                </section>
                <section>
                    <img src="assets/noge.jpeg" onclick="openMap('noge')" alt="noge cho">
                    <h3>野毛町で居酒屋文化を体験</h3>
                    <p>横浜の人は大体野毛で飲む。美味しいお店いっぱいある！</p>
                </section>
            </div>
        </div>
        <div id="footer">
            <div id="map">
                <h1></h1>
                <iframe
                    width="100%"
                    height="650px"
                    frameborder="0"
                    style="border:0"
                    src="https://www.google.com/maps/embed/v1/place?key=AIzaSyB2NIWI3Tv9iDPrlnowr_0ZqZWoAQydKJU&q=Japan%2C%20Kanagawa%2C%20Yokohama%2C%20Naka%20Ward%2C%20Yamashitach%C5%8D279%20%E5%B1%B1%E4%B8%8B%E5%85%AC%E5%9C%92&maptype=roadmap"
                    allowfullscreen></iframe>
            </div>
            <div id="selfintro">
                <img src="assets/mefishing.jpeg" onmouseover="this.src='assets/joke.webp'" onmouseout="this.src='assets/mefishing.jpeg'">
                <div id="introtext">
                    <h3>私の一言</h3>
                    <p>横浜にはもう3年目で、かなり色々なところ行っています。お任せてください！</p>
                    <p>Dat Ng</p>
                </div>
            </div>
        </div>
        <script src="script.js" defer></script>
    </body>
</html>
